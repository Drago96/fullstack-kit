name: Deploy API

# Builds the Nest image, pushes it to Artifact Registry and rolls a new Cloud Run
# revision. No long-lived key: GitHub's OIDC token is exchanged for the deploy service
# account through Workload Identity Federation. `scripts/provision.sh` creates every
# resource named here and sets every secret and variable it reads.
#
# The API applies pending Drizzle migrations on boot (apps/api/src/db/db.ts), so a
# deploy is nothing but a new revision.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  # Required to mint the OIDC token google-github-actions/auth exchanges.
  id-token: write

jobs:
  deploy:
    name: Cloud Run
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}

      # `env_vars` holds the non-secret config only. The five secrets are Secret Manager
      # references: the revision stores their names, and the runtime service account
      # resolves them at boot, so `run.services.get` shows no values. `provision.sh`
      # creates each secret and grants that account roles/secretmanager.secretAccessor;
      # this deploy account only attaches them (roles/run.admin plus
      # roles/iam.serviceAccountUser on the runtime account) and cannot read them.
      #
      # MOBILE_URL (absent without the mobile app) and EMAIL_FROM (defaulted in env.ts)
      # are optional, and an unset variable would otherwise send `KEY=`, which fails the
      # boot validation. So each is a whole row that collapses to a blank line the
      # action skips when its variable is empty.
      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          env_vars_update_strategy: overwrite
          env_vars: |-
            API_URL=${{ vars.API_URL }}
            WEB_URL=${{ vars.WEB_URL }}
            EMAIL_TRANSPORT=${{ vars.EMAIL_TRANSPORT }}
            LLM_PROVIDER=${{ vars.LLM_PROVIDER }}
            ${{ vars.MOBILE_URL && format('MOBILE_URL={0}', vars.MOBILE_URL) || '' }}
            ${{ vars.EMAIL_FROM && format('EMAIL_FROM={0}', vars.EMAIL_FROM) || '' }}
          secrets_update_strategy: overwrite
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            AUTH_SECRET=AUTH_SECRET:latest
            SENTRY_DSN=SENTRY_DSN:latest
            RESEND_API_KEY=RESEND_API_KEY:latest
            GOOGLE_GENERATIVE_AI_API_KEY=GOOGLE_GENERATIVE_AI_API_KEY:latest
