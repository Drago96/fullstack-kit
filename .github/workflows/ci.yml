name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: reference

env:
  # next build bakes this into the /api rewrite; the E2E servers listen on the same port.
  API_URL: http://localhost:3001
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  reference:
    name: Reference Project
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Script tests
        working-directory: .
        run: |
          bash scripts/review-loop/decide.test.sh
          bash scripts/kit-loop/pick.test.sh
          bash scripts/error-loop/pick.test.sh
          bash scripts/deploy-env.test.sh
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: reference/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: reference/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm biome ci .
      - name: Unused files, exports and dependencies
        run: pnpm knip
      - name: Typecheck, build, unit tests, API tests
        run: pnpm turbo run typecheck build test api-test
      - name: Client drift check
        run: |
          pnpm turbo run generate
          git diff --exit-code -- apps/api/openapi.json packages/api-client
      - name: Install Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm turbo run e2e
      - name: Docker build
        run: docker build -f apps/api/Dockerfile .
      # The mobile app is opt-in, so a Project generated without it has to stay green.
      # Deleting the workspace for real is the only honest proof, and it is cheap: the
      # install is the only work that is not a Turborepo cache hit. Last step in the job,
      # because it leaves the checkout and the lockfile without the mobile workspace.
      - name: Reference Project stays green with the mobile app removed
        run: |
          rm -rf apps/mobile
          pnpm install --no-frozen-lockfile
          pnpm biome ci .
          pnpm knip
          pnpm turbo run typecheck build test

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        working-directory: .
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz actionlint
          ./actionlint -color
