name: Error Loop

# Runs in every Project as a reusable workflow (see reference/.github/workflows/error-loop.yml).
# The Kit has no Sentry project of its own, so nothing calls it here.
on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_ORG:
        required: true
      SENTRY_PROJECT:
        required: true
      REVIEW_LOOP_GH_TOKEN:
        required: false

concurrency:
  group: error-loop
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    name: Error Loop
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The Loop's branch and PR must trigger CI and the Review Loop; those made with github.token do not.
      GH_TOKEN: ${{ secrets.REVIEW_LOOP_GH_TOKEN || github.token }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      # The skill and its scripts always come from the Kit's master.
      KIT_DIR: ${{ github.workspace }}/../kit
      # The regression tests run the stack the way CI does.
      API_URL: http://localhost:3001
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REVIEW_LOOP_GH_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch the Kit
        run: |
          rm -rf "$KIT_DIR"
          git clone -q --depth 1 https://github.com/Drago96/fullstack-kit "$KIT_DIR"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the Skill tool to load `error-loop` and follow it exactly. Its variables:
            SENTRY_ORG=${{ env.SENTRY_ORG }} SENTRY_PROJECT=${{ env.SENTRY_PROJECT }}
            GITHUB_REPOSITORY=${{ github.repository }} KIT_DIR=${{ env.KIT_DIR }} MAX_ISSUES=3
          claude_args: |
            --model claude-opus-5
            --max-turns 200
            --plugin-dir ${{ env.KIT_DIR }}
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,Bash(git *),Bash(gh issue view *),Bash(gh issue list *),Bash(gh issue create *),Bash(gh pr create *),Bash(gh pr list *),Bash(gh api *),Bash(curl *),Bash(pnpm *),Bash(node *),Bash(npx *),Bash(bash *)"
