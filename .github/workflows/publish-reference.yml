name: Publish reference branch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    name: Subtree split reference/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git subtree split --prefix=reference -b reference
          # The branch is regenerated from scratch every run, so its history is
          # rewritten by design (ADR 0006); Projects merge it, they never push to it.
          git push --force origin reference
