name: Review Loop

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

concurrency:
  group: review-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Review Loop
    # Drafts are skipped. On review events only "changes requested" matters.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      # Projects load the review-loop skill and Stack Rules from a clone of the Kit's master.
      KIT_DIR: ${{ github.workspace }}/../kit
      OUT_DIR: ${{ github.workspace }}/../review-loop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          # ponytail: fix commits pushed with github.token do not re-trigger CI; set REVIEW_LOOP_GH_TOKEN (fine-grained PAT, contents+pull-requests write) to lift that ceiling.
          token: ${{ secrets.REVIEW_LOOP_GH_TOKEN || github.token }}

      - name: Fetch the Kit
        run: git clone --depth 1 https://github.com/Drago96/fullstack-kit "$KIT_DIR"

      - name: Enable auto-merge (squash)
        run: gh pr merge "$PR_NUMBER" --auto --squash || echo "auto-merge not available on this repo; run scripts/review-loop/setup-repo.sh"

      - name: Gather context
        id: ctx
        run: |
          body=$(gh pr view "$PR_NUMBER" --json body --jq .body)
          issue=$(printf '%s\n' "$body" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          rounds=$(git log "origin/$BASE_REF..HEAD" --format=%s | grep -c '^review-loop: fix round' || true)
          changes=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '[group_by(.user.login)[] | max_by(.submitted_at) | select(.state=="CHANGES_REQUESTED")] | length > 0')
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "rounds=$rounds" >> "$GITHUB_OUTPUT"
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUT_DIR"

      - uses: anthropics/claude-code-action@v1
        env:
          ISSUE_NUMBER: ${{ steps.ctx.outputs.issue }}
          FIX_ROUNDS: ${{ steps.ctx.outputs.rounds }}
          CHANGES_REQUESTED: ${{ steps.ctx.outputs.changes }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Load and follow the `review-loop` skill from the plugin directory exactly. Environment for it:
            PR_NUMBER=${{ env.PR_NUMBER }} BASE_REF=${{ env.BASE_REF }} ISSUE_NUMBER=${{ steps.ctx.outputs.issue }}
            FIX_ROUNDS=${{ steps.ctx.outputs.rounds }} CHANGES_REQUESTED=${{ steps.ctx.outputs.changes }}
            KIT_DIR=${{ env.KIT_DIR }} OUT_DIR=${{ env.OUT_DIR }} GITHUB_REPOSITORY=${{ github.repository }}
          claude_args: |
            --model claude-opus-5
            --max-turns 60
            --plugin-dir ${{ env.KIT_DIR }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git *),Bash(gh issue view *),Bash(gh api repos/*/pulls/*/reviews),Bash(bash */decide.sh *),Bash(pnpm *),Bash(node *)"

      - name: Post review and decide
        id: decide
        run: |
          test -f "$OUT_DIR/verdict.json" || { echo "::error::review produced no verdict"; exit 1; }
          blocking=$(jq -r .blocking "$OUT_DIR/verdict.json")
          decision=$(bash "$KIT_DIR/scripts/review-loop/decide.sh" "$blocking" "${{ steps.ctx.outputs.rounds }}" "${{ steps.ctx.outputs.changes }}")
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          { echo "<!-- review-loop -->"; echo "**Review Loop:** $decision (blocking: $blocking, fix rounds: ${{ steps.ctx.outputs.rounds }}/2)"; echo; cat "$OUT_DIR/review.md"; } > "$OUT_DIR/comment.md"
          event=COMMENT; [ "$decision" = pass ] && event=APPROVE
          gh pr review "$PR_NUMBER" --event "$event" --body-file "$OUT_DIR/comment.md" 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body-file "$OUT_DIR/comment.md"

      - name: Fix round
        if: steps.decide.outputs.decision == 'fix'
        run: |
          git config user.name "review-loop[bot]"
          git config user.email "review-loop@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "::error::fix round produced no changes"; exit 1; }
          git commit -m "review-loop: fix round $(( ${{ steps.ctx.outputs.rounds }} + 1 ))"
          git push
          echo "::error::blocking findings; pushed a fix, the next run re-reviews"; exit 1

      - name: Hand off to a human
        if: steps.decide.outputs.decision == 'handoff'
        run: |
          gh pr edit "$PR_NUMBER" --add-label ready-for-human
          gh pr comment "$PR_NUMBER" --body "$(printf '## Needs a human\n\nReview Loop gave up after 2 fix rounds. Unresolved blocking Findings:\n\n%s' "$(grep -F '[blocking]' "$OUT_DIR/review.md" || echo '(see review above)')")"
          echo "::error::unresolved blocking findings"; exit 1
