name: Review Loop

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    uses: Drago96/fullstack-kit/.github/workflows/review-loop.yml@master
    secrets: inherit
