packages:
  - apps/*
  - packages/*
allowBuilds:
  # next-intl's message extractor pulls these in; both ship their native binary as a
  # platform-specific optional dependency, so no postinstall build is needed.
  "@parcel/watcher": false
  "@scarf/scarf": false
  # @sentry/nextjs pulls @sentry/cli in for source-map upload, which needs an auth
  # token this Project does not set, so the postinstall that downloads its binary
  # is not needed.
  "@sentry/cli": false
  "@swc/core": false
  # drizzle-kit pulls esbuild in; pnpm installs its platform binary as an optional
  # dependency, so the postinstall that would fetch one is not needed.
  esbuild: false
overrides:
  # Dependabot #1 / GHSA-67mh-4wv8-2f99 (esbuild <= 0.24.2): drizzle-kit pulls esbuild
  # through the deprecated @esbuild-kit/esm-loader, which pins ~0.18.20, so there is no
  # parent release to bump to.
  esbuild@<0.25.0: ^0.25.0
  # Dependabot #2 / GHSA-w5hq-g745-h8pq (uuid < 11.1.1): expo -> @expo/config-plugins ->
  # xcode pins uuid ^7.0.3 and has no release on a patched uuid.
  uuid@<11.1.1: ^11.1.1
  # Not overridden: decode-uri-component (Dependabot #5 / GHSA-vcc3-ghjq-m6fr). The only
  # patched release, 0.5.0, is ESM-only, and its consumer here — query-string@7.1.3, which
  # expo-router loads with a CJS `require` — then gets the module namespace instead of the
  # function and throws. Same for query-string@9, which is ESM-only itself.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - '@expo/ui@57.0.16'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo-router@57.0.19
  - expo@57.0.20
